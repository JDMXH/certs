<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>珍藏资源</title>
<style>
:root{--bg:#f2f2f4;--panel:#fff;--line:#e2e2e6;--text:#1d1d1f;--dim:#86868b;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--panel:#17171a;--line:#2a2a30;--text:#f2f2f4;--dim:#8f8f96;--accent:#4aa3ff;--accent-soft:rgba(74,163,255,.14)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.top h1{margin:0;font-size:16px;font-weight:650}
.top .sub{color:var(--dim);font-size:12.5px}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
.toolbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--accent-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.link-card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;transition:border-color .15s,transform .15s,box-shadow .15s}
.link-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.10)}
.link-card a{display:block;color:inherit;text-decoration:none}
.link-card .t{font-weight:600;font-size:15px;margin-bottom:4px;padding-right:52px;word-break:break-word}
.link-card .u{color:var(--accent);font-size:12px;word-break:break-all}
.link-card .d{color:var(--dim);font-size:13px;margin-top:8px}
.link-ops{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.link-card:hover .link-ops,.link-card:focus-within .link-ops{opacity:1}
.link-ops button{width:26px;height:26px;border:0;border-radius:7px;background:var(--accent-soft);color:var(--text);cursor:pointer;font-size:13px;line-height:1}
.link-ops button:hover{background:var(--accent);color:#fff}
.empty{color:var(--dim);font-size:13.5px;padding:36px 0;text-align:center;border:1px dashed var(--line);border-radius:14px}

</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← 返回</a><h1>珍藏资源</h1><span class="sub"></span></div>
<div class="wrap">
<p style="margin:0 0 16px;color:var(--dim);font-size:13px">自己添加的链接存在这台浏览器里。想让所有人看到，用「导出」把列表发我，我写进页面。</p>
<div class="toolbar">
  <input id="search" placeholder="搜索标题或网址…">
  <button class="btn" id="addBtn">+ 添加链接</button>
  <button class="btn ghost" id="exportBtn">导出</button>
  <button class="btn ghost" id="importBtn">导入</button>
  <input type="file" id="importFile" accept=".json" hidden>
</div>
<div class="cards" id="cards"></div>
<div class="empty" id="empty" hidden>还没有链接，点「+ 添加链接」加一个</div>
</div>
<script>
const DEFAULT_LINKS = [{"title":"B 站","url":"https://www.bilibili.com","desc":"示例链接，可在页面上改或删"},{"title":"GitHub","url":"https://github.com","desc":"示例链接"}];
const LS_KEY = 'favLinks';
let links = [];
function loadLinks() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { links = JSON.parse(raw); return; } } catch (e) {}
  links = DEFAULT_LINKS.slice(); saveLinks();
}
function saveLinks() { try { localStorage.setItem(LS_KEY, JSON.stringify(links)); } catch (e) { alert('保存失败：浏览器存储不可用'); } }
const cardsEl = document.getElementById('cards'), emptyEl = document.getElementById('empty'), searchEl = document.getElementById('search');
let keyword = '';
function esc(s){ return String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hostOf(u){ try { return new URL(u).host; } catch { return u; } }
function renderLinks() {
  const kw = keyword.trim().toLowerCase();
  const list = links.filter((l) => !kw || (l.title+' '+l.url+' '+(l.desc||'')).toLowerCase().includes(kw));
  cardsEl.innerHTML = list.map((l) => {
    const i = links.indexOf(l);
    return '<article class="link-card" data-i="'+i+'">' +
      '<div class="link-ops"><button data-op="edit" title="编辑">✎</button><button data-op="del" title="删除">🗑</button></div>' +
      '<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">' +
        '<div class="t">'+esc(l.title)+'</div><div class="u">'+esc(hostOf(l.url))+'</div>' +
        (l.desc ? '<div class="d">'+esc(l.desc)+'</div>' : '') + '</a></article>';
  }).join('');
  emptyEl.hidden = list.length > 0;
}
cardsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-op]'); if (!btn) return; e.preventDefault();
  const i = Number(btn.closest('.link-card').dataset.i);
  if (btn.dataset.op === 'del') { if (confirm('删除「'+links[i].title+'」？')) { links.splice(i,1); saveLinks(); renderLinks(); } }
  else editLink(i);
});
function editLink(i) {
  const cur = links[i] || { title:'', url:'', desc:'' };
  const title = prompt('标题', cur.title); if (title === null) return;
  const url = prompt('网址（http:// 或 https:// 开头）', cur.url); if (url === null) return;
  if (!/^https?:\/\//i.test(url.trim())) { alert('网址要以 http:// 或 https:// 开头'); return; }
  const desc = prompt('备注（可留空）', cur.desc || ''); if (desc === null) return;
  const item = { title: title.trim() || hostOf(url.trim()), url: url.trim(), desc: desc.trim() };
  if (i >= 0) links[i] = item; else links.push(item);
  saveLinks(); renderLinks();
}
document.getElementById('addBtn').onclick = () => editLink(-1);
searchEl.addEventListener('input', () => { keyword = searchEl.value; renderLinks(); });
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(links, null, 2)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'favLinks.json'; a.click(); URL.revokeObjectURL(a.href);
};
const fileEl = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => fileEl.click();
fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('格式不对');
    links = data.filter((x) => x && x.url).map((x) => ({ title: String(x.title || hostOf(String(x.url))), url: String(x.url), desc: String(x.desc || '') }));
    saveLinks(); renderLinks();
  } catch (err) { alert('导入失败：' + err.message); }
  fileEl.value = '';
});
loadLinks(); renderLinks();
</script>
</body>
</html>
