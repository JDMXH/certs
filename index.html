<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9178666</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#fff;background:#05060c}

#bg{position:fixed;inset:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 40%, transparent 36%, rgba(0,0,0,.60) 100%)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>")}

.tiles{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100vh;padding:26px}

/* ---------- liquid glass pane ---------- */
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:32px;overflow:hidden;text-decoration:none;color:#fff;cursor:pointer;
  isolation:isolate;
  background:linear-gradient(180deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.045) 42%, rgba(255,255,255,.025) 100%);
  border:1px solid rgba(255,255,255,.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.60),
    inset 0 -1px 0 rgba(255,255,255,.10),
    inset 0 -30px 52px -30px rgba(0,0,0,.55),
    0 24px 60px rgba(0,0,0,.46);
  transition:transform .55s cubic-bezier(.2,.8,.2,1), box-shadow .55s, border-color .4s;
}

/* the refracting layer: this is what bends the background at the rim.
   --glass is the displacement map (data URI, built by JS) and --edge is the
   border-width used by the feDisplacementMap scale. */
.tile .refract{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  backdrop-filter:blur(3px) saturate(180%) brightness(1.08);
  -webkit-backdrop-filter:blur(3px) saturate(180%) brightness(1.08);
  /* edge-only magnification: scale up slightly with a radial mask so the rim
     shows a compressed, lens-like copy of what is behind */
  -webkit-mask:radial-gradient(140% 130% at 50% 50%, transparent 46%, #000 78%);
  mask:radial-gradient(140% 130% at 50% 50%, transparent 46%, #000 78%);
  transform:scale(1.012);
}

/* deep frosted core (what Apple calls the "material body") */
.tile .frost{position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
  backdrop-filter:blur(1.5px) saturate(140%);
  -webkit-backdrop-filter:blur(1.5px) saturate(140%);
  -webkit-mask:radial-gradient(120% 110% at 50% 50%, #000 52%, transparent 76%);
  mask:radial-gradient(120% 110% at 50% 50%, #000 52%, transparent 76%);
}

/* specular rim: bright at the pointer side, hue-fringed like a real glass edge */
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.25px;z-index:4;
  background:linear-gradient(var(--rim-angle,150deg),
    rgba(255,255,255,.92) 0%,
    rgba(190,215,255,.30) 18%,
    rgba(255,255,255,.04) 38%,
    rgba(255,210,250,.10) 62%,
    rgba(255,255,255,.55) 88%,
    rgba(255,255,255,.90) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;opacity:.9;transition:opacity .4s}

/* bottom scrim for label legibility */
.tile::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;
  background:linear-gradient(to top, rgba(3,4,10,.58) 0%, rgba(3,4,10,.10) 46%, transparent 70%)}

.tile .sheen{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .5s;pointer-events:none;
  background:radial-gradient(560px 300px at var(--mx,50%) var(--my,0%),
    rgba(255,255,255,.42), rgba(255,255,255,.12) 34%, transparent 66%);
  mix-blend-mode:screen}
.tile:hover .sheen{opacity:1}

.tile .caustics{position:absolute;inset:-30%;z-index:2;opacity:.30;pointer-events:none;
  background:
    radial-gradient(38% 26% at 26% 30%, rgba(130,180,255,.34), transparent 62%),
    radial-gradient(34% 24% at 74% 68%, rgba(255,140,220,.26), transparent 62%);
  filter:blur(20px);animation:caustic 17s ease-in-out infinite alternate}
@keyframes caustic{
  from{transform:translate3d(-3%, -2%, 0) rotate(-2deg) scale(1)}
  to{transform:translate3d(4%, 3%, 0) rotate(3deg) scale(1.09)}
}

.tile:hover{transform:translateY(-7px);border-color:rgba(255,255,255,.40);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.80),
    inset 0 -30px 56px -30px rgba(0,0,0,.60),
    0 36px 84px rgba(0,0,0,.52)}
.tile:hover::before{opacity:1}

.tile-inner{padding:36px 40px 40px;position:relative;z-index:5}
.tile .ico{font-size:46px;line-height:1;margin-bottom:18px;display:block;transition:transform .5s;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.tile:hover .ico{transform:scale(1.14) rotate(-5deg)}
.tile h2{margin:0 0 8px;font-size:31px;font-weight:750;letter-spacing:.6px;text-shadow:0 2px 18px rgba(0,0,0,.60)}
.tile p{margin:0;color:rgba(255,255,255,.80);font-size:14px}
.tile .arrow{margin-top:24px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650;
  color:rgba(255,255,255,.96);transition:gap .35s}
.tile:hover .arrow{gap:18px}
.badge{position:absolute;top:24px;right:26px;z-index:5;font-size:12px;padding:5px 13px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);
  backdrop-filter:blur(10px);letter-spacing:.3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}

.wipe{position:fixed;inset:0;z-index:99;background:#05060c;opacity:0;pointer-events:none;transition:opacity .22s ease}
.wipe.on{opacity:1}

@media (max-width:820px){
  .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px}
  .tile-inner{padding:24px 26px 28px}
  .tile .ico{font-size:34px;margin-bottom:12px}
  .tile h2{font-size:23px}
  .badge{top:18px;right:20px}
}
@media (prefers-reduced-motion:reduce){
  .tile,.tile .ico,.tile .arrow,.tile .caustics{transition:none;animation:none}
}
</style>

  function makeWhale(i, W, H) {
    const scale = i === 0 ? 1 : 0.55 + Math.random() * 0.35;
    return {
      x: Math.random() * W,
      y: H * (0.15 + Math.random() * 0.7),
      size: (i === 0 ? 150 : 60 + Math.random() * 70) * scale,
      speed: (i === 0 ? 26 : 46 + Math.random() * 40) * (Math.random() < 0.5 ? -1 : 1),
      amp: 18 + Math.random() * 26,
      freq: 0.0016 + Math.random() * 0.0014,
      phase: Math.random() * Math.PI * 2,
      time: Math.random() * 1000,
      bob: Math.random() * Math.PI * 2,
      alpha: i === 0 ? 0.42 : 0.55 + Math.random() * 0.3,
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const count = Math.round(Math.min(150, Math.max(50, (W * H) / 14000)));
    particles = Array.from({ length: count }, () => {
      const depth = Math.random() * 0.8 + 0.2;
      return {
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.22 * depth,
        vy: (Math.random() - 0.5) * 0.22 * depth,
        r: 0.7 + depth * 1.9, depth,
        hue: Math.random() < 0.5 ? 215 : 320,
        tw: Math.random() * Math.PI * 2,
      };
    });

    blobs = [
      { x: 0.18, y: 0.24, r: 0.42, hue: 218, sp: 0.00013, ph: 0 },
      { x: 0.82, y: 0.76, r: 0.46, hue: 322, sp: 0.00011, ph: 1.7 },
      { x: 0.55, y: 0.10, r: 0.32, hue: 265, sp: 0.00017, ph: 3.1 },
    ];
    if (!whales.length) whales = Array.from({ length: 4 }, (_, i) => makeWhale(i, W, H));
  }

  function drawWhale(w, dt) {
    if (!logo.complete || !logo.naturalWidth) return;
    w.time += dt;
    w.x += w.speed * dt;
    if (w.speed > 0 && w.x > W + w.size) { w.x = -w.size; w.y = H * (0.15 + Math.random() * 0.7); }
    if (w.speed < 0 && w.x < -w.size) { w.x = W + w.size; w.y = H * (0.15 + Math.random() * 0.7); }

    const phase = w.time * w.freq * 1.8 + w.phase;
    const yBase = w.y + Math.sin(phase) * w.amp;
    const bob = Math.sin(w.time * 0.0022 + w.bob) * 5;
    const dir = w.speed >= 0 ? 1 : -1;
    const slope = Math.cos(phase) * w.amp * w.freq * 1.8;
    const angle = Math.atan2(slope * dir, 1) * 0.55 + Math.sin(w.time * 0.0015 + w.bob) * 0.045;

    ctx.save();
    ctx.translate(w.x, yBase + bob);
    ctx.rotate(angle);
    ctx.scale(dir, 1);
    ctx.globalAlpha = w.alpha;

    const s = w.size;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.75);
    g.addColorStop(0, 'rgba(96,140,255,.30)');
    g.addColorStop(1, 'rgba(96,140,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, Math.PI * 2); ctx.fill();

    ctx.drawImage(logo, -s / 2, -s / 2, s, s);
    ctx.restore();
  }

  const LINK_DIST = 132;

  function draw(t, dt) {
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#05060c'); g.addColorStop(0.55, '#080a14'); g.addColorStop(1, '#0a0710');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      const cx = (b.x + Math.sin(t * b.sp + b.ph) * 0.10) * W;
      const cy = (b.y + Math.cos(t * b.sp * 1.3 + b.ph) * 0.10) * H;
      const rr = b.r * Math.min(W, H);
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      rg.addColorStop(0, 'hsla(' + b.hue + ',85%,58%,0.20)');
      rg.addColorStop(0.45, 'hsla(' + b.hue + ',85%,50%,0.08)');
      rg.addColorStop(1, 'hsla(' + b.hue + ',85%,50%,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    const px = (mouse.x - 0.5) * 26, py = (mouse.y - 0.5) * 26;

    ctx.lineWidth = 1;
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > LINK_DIST * LINK_DIST) continue;
        const near = a.depth > 0.62 && b.depth > 0.62;
        if (!near && d2 > (LINK_DIST * 0.68) ** 2) continue;
        const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * (near ? 0.20 : 0.07);
        ctx.strokeStyle = 'rgba(150,190,255,' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.x + px * a.depth, a.y + py * a.depth);
        ctx.lineTo(b.x + px * b.depth, b.y + py * b.depth);
        ctx.stroke();
      }
    }

    for (const p of particles) {
      if (!reduce) {
        p.x += p.vx; p.y += p.vy; p.tw += 0.015;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      }
      const tw = 0.65 + Math.sin(p.tw) * 0.35;
      const x = p.x + px * p.depth, y = p.y + py * p.depth;
      const r = p.r * (1 + (p.depth - 0.5) * 0.5);
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r * 4.2);
      rg.addColorStop(0, 'hsla(' + p.hue + ',100%,82%,' + (0.85 * tw * p.depth).toFixed(3) + ')');
      rg.addColorStop(0.35, 'hsla(' + p.hue + ',100%,66%,' + (0.30 * tw * p.depth).toFixed(3) + ')');
      rg.addColorStop(1, 'hsla(' + p.hue + ',100%,60%,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, r * 4.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + (0.80 * tw * p.depth).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    }

    // whales on top of the field, still under the glass panes
    for (let i = whales.length - 1; i >= 0; i--) drawWhale(whales[i], dt);
  }

  let raf = 0, last = 0, running = true;
  function loop(t) {
    if (!running) return;
    mouse.x += (mouse.tx - mouse.x) * 0.06;
    mouse.y += (mouse.ty - mouse.y) * 0.06;
    if (t - last > 1000 / 45) {
      const dt = last ? Math.min(0.1, (t - last) / 1000) : 0.016;
      draw(t, dt);
      last = t;
    }
    raf = requestAnimationFrame(loop);
  }

  addEventListener('resize', () => { resize(); draw(performance.now(), 0.016); });
  addEventListener('mousemove', (e) => {
    mouse.tx = e.clientX / innerWidth;
    mouse.ty = e.clientY / innerHeight;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; cancelAnimationFrame(raf); }
    else if (!running) { running = true; last = 0; raf = requestAnimationFrame(loop); }
  });

  resize();
  raf = requestAnimationFrame(loop);

  document.querySelectorAll('.tile').forEach((tile) => {
    tile.addEventListener('mousemove', (e) => {
      const r = tile.getBoundingClientRect();
      const mx = (e.clientX - r.left) / r.width;
      const my = (e.clientY - r.top) / r.height;
      tile.style.setProperty('--mx', (mx * 100).toFixed(1) + '%');
      tile.style.setProperty('--my', (my * 100).toFixed(1) + '%');
      // rotate the specular rim so its brightest point faces the pointer
      const deg = (Math.atan2(my - 0.5, mx - 0.5) * 180 / Math.PI + 90).toFixed(1);
      tile.style.setProperty('--rim-angle', deg + 'deg');
    });
    tile.addEventListener('click', (e) => {
      const href = tile.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      document.getElementById('wipe').classList.add('on');
      setTimeout(() => { location.href = href; }, 180);
    });
  });
})();
</script>
</body>
</html>
