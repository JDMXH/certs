<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9178666</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#fff}

/* ---- full-screen background ---- */
.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(1200px 700px at 15% 20%, #2a3f6e 0%, transparent 60%),
    radial-gradient(1000px 800px at 85% 80%, #6e2a5a 0%, transparent 62%),
    linear-gradient(135deg, #0b1020 0%, #14182b 45%, #1d1020 100%);
}
.bg::after{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px);
  background-size:26px 26px;opacity:.35;animation:drift 60s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:260px 260px}}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;animation:float 14s ease-in-out infinite alternate}
.g1{width:420px;height:420px;background:#3b6ef0;top:-120px;left:-80px}
.g2{width:480px;height:480px;background:#c0348a;bottom:-140px;right:-100px;animation-delay:-6s}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(40px,-30px,0) scale(1.12)}}

/* ---- two tiles ---- */
.tiles{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100vh;padding:26px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:26px;overflow:hidden;text-decoration:none;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);
  backdrop-filter:blur(10px) saturate(140%);
  transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s, border-color .3s;
  isolation:isolate}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;
  background:linear-gradient(160deg, rgba(59,110,240,.55), rgba(0,0,0,0) 70%)}
.tile.t2::before{background:linear-gradient(160deg, rgba(192,52,138,.55), rgba(0,0,0,0) 70%)}
.tile::after{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top, rgba(0,0,0,.62) 0%, rgba(0,0,0,.12) 46%, transparent 72%)}
.tile:hover{transform:translateY(-6px);box-shadow:0 30px 70px rgba(0,0,0,.45);border-color:rgba(255,255,255,.34)}
.tile:active{transform:translateY(-2px) scale(.995)}

.tile-inner{padding:34px 38px 38px}
.tile .ico{font-size:44px;line-height:1;margin-bottom:16px;display:block;transition:transform .45s}
.tile:hover .ico{transform:scale(1.12) rotate(-4deg)}
.tile h2{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:.5px}
.tile p{margin:0;color:rgba(255,255,255,.72);font-size:14px}
.tile .arrow{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  color:rgba(255,255,255,.92);transition:gap .3s}
.tile:hover .arrow{gap:16px}
.badge{position:absolute;top:24px;right:26px;font-size:12px;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px)}

/* one-frame page transition */
.wipe{position:fixed;inset:0;z-index:99;background:#0b1020;opacity:0;pointer-events:none;transition:opacity .22s ease}
.wipe.on{opacity:1}

@media (max-width:820px){
  .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:16px;padding:16px}
  .tile-inner{padding:24px 26px 28px}
  .tile .ico{font-size:34px;margin-bottom:12px}
  .tile h2{font-size:23px}
  .badge{top:18px;right:20px}
}
</style>
</head>
<body>
<div class="bg"><span class="glow g1"></span><span class="glow g2"></span></div>

<div class="tiles">
  <a class="tile t1" href="album.html">
    <span class="badge" id="albumCount">相册</span>
    <div class="tile-inner">
      <span class="ico">🖼️</span>
      <h2>相册</h2>
      <p>保存的照片与证书，点开看大图</p>
      <span class="arrow">进入 <span>→</span></span>
    </div>
  </a>

  <a class="tile t2" href="links.html">
    <span class="badge">珍藏资源</span>
    <div class="tile-inner">
      <span class="ico">📚</span>
      <h2>珍藏资源</h2>
      <p>收藏的链接，可自己添加整理</p>
      <span class="arrow">进入 <span>→</span></span>
    </div>
  </a>
</div>

<div class="wipe" id="wipe"></div>
<script>
document.querySelectorAll('.tile').forEach((a) => {
  a.addEventListener('click', (e) => {
    const href = a.getAttribute('href');
    if (!href) return;
    e.preventDefault();
    const wipe = document.getElementById('wipe');
    wipe.classList.add('on');
    setTimeout(() => { location.href = href; }, 180);
  });
});
</script>
</body>
</html>
