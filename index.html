<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9178666</title>
<style>
:root{--bg:#ffffff;--ink:#111114;--dim:#6b6b73;--accent:#4d6bfe}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}

.halo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(44% 38% at 50% 48%, rgba(77,107,254,.22), rgba(77,107,254,.07) 54%, transparent 76%),
    radial-gradient(30% 26% at 18% 22%, rgba(120,150,255,.10), transparent 70%),
    radial-gradient(30% 26% at 84% 78%, rgba(160,120,255,.10), transparent 70%)}

.whale{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.whale img{width:min(64vw,740px);height:auto;filter:saturate(2.2) hue-rotate(-6deg) brightness(1.02) contrast(1.14)}

/* ---- language pill ---- */
.lang{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;padding:3px;border-radius:999px;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(14px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 6px 20px rgba(17,17,20,.08)}
.lang button{position:relative;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
  color:var(--dim);padding:6px 16px;border-radius:999px;cursor:pointer;transition:color .2s,background .25s}
.lang button.on{color:#fff;background:var(--accent);box-shadow:0 2px 8px rgba(77,107,254,.35)}

/* ================= liquid glass pane ================= */
.tiles{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100vh;padding:26px}

.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:34px;overflow:hidden;text-decoration:none;color:var(--ink);cursor:pointer;isolation:isolate;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,1),
    inset 0 -1px 1px rgba(255,255,255,.60),
    inset 1px 0 1px rgba(255,255,255,.55),
    inset -1px 0 1px rgba(255,255,255,.55),
    inset 0 -26px 34px -22px rgba(77,107,254,.16),
    inset 0 26px 30px -24px rgba(255,255,255,.9),
    0 1px 1px rgba(17,17,20,.05),
    0 18px 44px rgba(17,17,20,.12),
    0 2px 9px rgba(17,17,20,.06);
  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, border-color .35s}

.tile .frost{position:absolute;inset:0;z-index:-2;border-radius:inherit;pointer-events:none;
  backdrop-filter:blur(3px) saturate(180%) brightness(1.02);
  -webkit-backdrop-filter:blur(3px) saturate(180%) brightness(1.02)}

.tile .warp{position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  backdrop-filter:url(#lg-warp); -webkit-backdrop-filter:url(#lg-warp); opacity:.9;
  -webkit-mask:radial-gradient(120% 116% at 50% 50%, transparent 52%, #000 84%);
  mask:radial-gradient(120% 116% at 50% 50%, transparent 52%, #000 84%)}

.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.75px;z-index:3;
  background:linear-gradient(var(--rim-angle,150deg),
    rgba(255,255,255,1) 0%, rgba(200,220,255,.55) 12%, rgba(255,255,255,.18) 30%,
    rgba(255,255,255,.06) 55%, rgba(255,220,255,.35) 80%, rgba(255,255,255,.95) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none}

.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:3;
  background:linear-gradient(var(--rim-angle,150deg),
    rgba(255,90,170,.45), transparent 22%, transparent 74%, rgba(90,230,255,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;mix-blend-mode:screen;opacity:.9;transform:translate(0.6px,0.6px)}

.tile .sheen{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none;transition:opacity .45s;
  background:radial-gradient(520px 280px at var(--mx,50%) var(--my,0%),
    rgba(255,255,255,.85), rgba(255,255,255,.25) 32%, transparent 64%)}
.tile:hover .sheen{opacity:1}

.tile:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.85)}

.tile-inner{padding:34px 38px 38px;position:relative;z-index:4}
.tile .ico{font-size:42px;line-height:1;margin-bottom:16px;display:block;transition:transform .4s}
.tile:hover .ico{transform:scale(1.1)}
.tile h2{margin:0 0 8px;font-size:30px;font-weight:750;letter-spacing:.4px}
.tile p{margin:0;color:var(--dim);font-size:14px}
.tile .arrow{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650;
  color:var(--accent);transition:gap .3s}
.tile:hover .arrow{gap:16px}
.badge{position:absolute;top:22px;right:24px;z-index:4;font-size:12px;padding:5px 12px;border-radius:999px;
  color:var(--dim);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);
  backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}

.wipe{position:fixed;inset:0;z-index:99;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .18s}
.wipe.on{opacity:1}

@media (max-width:820px){
  .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px}
  .tile-inner{padding:22px 24px 26px}
  .tile .ico{font-size:32px;margin-bottom:10px}
  .tile h2{font-size:22px}
  .whale img{width:88vw}
  .lang{top:12px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-warp" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.006" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="14" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="lang" role="group" aria-label="Language / 语言">
  <button data-lang="zh" class="on">中文</button>
  <button data-lang="en">EN</button>
</div>

  <a class="tile" href="album.html">
    <span class="frost"></span><span class="warp"></span><span class="sheen"></span>
    <span class="badge" data-i18n="badgeAlbum">相册</span>
    <div class="tile-inner">
      <span class="ico">🖼️</span>
      <h2 data-i18n="albumTitle">相册</h2>
      <p data-i18n="albumDesc">保存的照片与证书，点开看大图</p>
      <span class="arrow"><span data-i18n="enter">进入</span> <span>→</span></span>
    </div>
  </a>
  <a class="tile" href="links.html">
    <span class="frost"></span><span class="warp"></span><span class="sheen"></span>
    <span class="badge" data-i18n="badgeLinks">珍藏资源</span>
    <div class="tile-inner">
      <span class="ico">📚</span>
      <h2 data-i18n="linksTitle">珍藏资源</h2>
      <p data-i18n="linksDesc">收藏的链接，可自己添加整理</p>
      <span class="arrow"><span data-i18n="enter">进入</span> <span>→</span></span>
    </div>
  </a>
</div>

<div class="wipe" id="wipe"></div>

<script>
const I18N = {
  zh: {
    title: '9178666',
    albumTitle: '相册', albumDesc: '保存的照片与证书，点开看大图',
    linksTitle: '珍藏资源', linksDesc: '收藏的链接，可自己添加整理',
    badgeAlbum: '相册', badgeLinks: '珍藏资源', enter: '进入',
  },
  en: {
    title: '9178666',
    albumTitle: 'Album', albumDesc: 'Saved photos and certificates — click to enlarge',
    linksTitle: 'Collection', linksDesc: 'Bookmarked links you can add and organise',
    badgeAlbum: 'Album', badgeLinks: 'Collection', enter: 'Enter',
  },
};
const LS_KEY = 'lang';
function applyLang(lang) {
  const dict = I18N[lang] || I18N.zh;
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  document.documentElement.dataset.lang = lang;
  document.title = dict.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const k = el.dataset.i18n;
    if (dict[k] != null) el.textContent = dict[k];
  });
  document.querySelectorAll('.lang button').forEach((b) => b.classList.toggle('on', b.dataset.lang === lang));
  try { localStorage.setItem(LS_KEY, lang); } catch (e) {}
}
const saved = (() => { try { return localStorage.getItem(LS_KEY); } catch { return null; } })();
const initial = saved || ((navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en');
applyLang(initial);
document.querySelectorAll('.lang button').forEach((b) => {
  b.addEventListener('click', () => applyLang(b.dataset.lang));
});

document.querySelectorAll('.tile').forEach((tile) => {
  tile.addEventListener('mousemove', (e) => {
    const r = tile.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width;
    const my = (e.clientY - r.top) / r.height;
    tile.style.setProperty('--mx', (mx * 100).toFixed(1) + '%');
    tile.style.setProperty('--my', (my * 100).toFixed(1) + '%');
    const deg = (Math.atan2(my - 0.5, mx - 0.5) * 180 / Math.PI + 90).toFixed(1);
    tile.style.setProperty('--rim-angle', deg + 'deg');
  });
  tile.addEventListener('click', (e) => {
    const href = tile.getAttribute('href');
    if (!href) return;
    e.preventDefault();
    document.getElementById('wipe').classList.add('on');
    setTimeout(() => { location.href = href; }, 160);
  });
});
</script>
</body>
</html>
