<style>
:root{--bg:#ffffff;--ink:#111114;--dim:#6b6b73;--line:#e6e6ea;--accent:#4d6bfe}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d0d0f;--ink:#f4f4f6;--dim:#9a9aa2;--line:#26262c}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink)}

/* ---- static whale watermark, centred behind everything ---- */
.whale{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.whale img{width:min(62vw,720px);height:auto;opacity:.07;filter:saturate(.2)}
@media (prefers-color-scheme:dark){ .whale img{opacity:.10;filter:saturate(.6) brightness(1.3)} }

/* ---- two panes ---- */
.tiles{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100vh;padding:26px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:26px;overflow:hidden;text-decoration:none;color:inherit;cursor:pointer;
  background:var(--bg);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.06);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, border-color .25s}
.tile:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 2px 6px rgba(0,0,0,.05), 0 22px 52px rgba(77,107,254,.16)}
.tile-inner{padding:34px 38px 38px}
.tile .ico{font-size:42px;line-height:1;margin-bottom:16px;display:block;transition:transform .35s}
.tile:hover .ico{transform:scale(1.1)}
.tile h2{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:.4px}
.tile p{margin:0;color:var(--dim);font-size:14px}
.tile .arrow{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
  color:var(--accent);transition:gap .3s}
.tile:hover .arrow{gap:16px}
.badge{position:absolute;top:22px;right:24px;font-size:12px;padding:5px 12px;border-radius:999px;
  color:var(--dim);background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line)}

.wipe{position:fixed;inset:0;z-index:99;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .18s ease}
.wipe.on{opacity:1}

@media (max-width:820px){
  .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px}
  .tile-inner{padding:22px 24px 26px}
  .tile .ico{font-size:32px;margin-bottom:10px}
  .tile h2{font-size:22px}
  .whale img{width:80vw}
}
</style>
</head>

<div class="wipe" id="wipe"></div>
<script>
document.querySelectorAll('.tile').forEach((tile) => {
  tile.addEventListener('click', (e) => {
    const href = tile.getAttribute('href');
    if (!href) return;
    e.preventDefault();
    document.getElementById('wipe').classList.add('on');
    setTimeout(() => { location.href = href; }, 160);
  });
});
</script>
