<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9178666</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#fff;background:#05060c}

#bg{position:fixed;inset:0;z-index:0;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 40%, transparent 38%, rgba(0,0,0,.55) 100%)}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>")}

/* ---- two liquid-glass tiles ---- */
.tiles{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:22px;height:100vh;padding:26px}

/* liquid glass = strong blur + saturation, a bright inner top edge, a soft inner
   shadow at the bottom, and a moving specular highlight. The ::before ring gives the
   refractive rim; the .sheen layer tracks the cursor as the specular hotspot. */
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  border-radius:30px;overflow:hidden;text-decoration:none;color:#fff;cursor:pointer;

  background:
    linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.06) 38%, rgba(255,255,255,.03) 100%);
  backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
  -webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.06);

  border:1px solid rgba(255,255,255,.30);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.55),
    inset 0 -1px 0 rgba(255,255,255,.14),
    inset 1px 0 0 rgba(255,255,255,.16),
    inset -1px 0 0 rgba(255,255,255,.16),
    inset 0 -28px 48px -28px rgba(0,0,0,.55),
    0 18px 44px rgba(0,0,0,.42);

  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, border-color .35s, backdrop-filter .5s;
  isolation:isolate}

/* refraction rim: a hairline gradient ring that reads as a glass edge */
.tile::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:2;
  background:linear-gradient(150deg, rgba(255,255,255,.75), rgba(255,255,255,.06) 32%, rgba(255,255,255,.04) 62%, rgba(255,255,255,.42));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;opacity:.85}

/* bottom scrim so the label stays readable over bright background */
.tile::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  background:linear-gradient(to top, rgba(3,4,10,.60) 0%, rgba(3,4,10,.12) 46%, transparent 72%)}

/* specular hotspot following the cursor */
.tile .sheen{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .45s;
  background:radial-gradient(520px 280px at var(--mx,50%) var(--my,0%),
    rgba(255,255,255,.34), rgba(255,255,255,.10) 38%, transparent 68%);
  mix-blend-mode:screen}
.tile:hover .sheen{opacity:1}

/* faint caustics: two slow curved highlights that drift, like light through glass */
.tile .caustics{position:absolute;inset:-30%;z-index:0;opacity:.35;pointer-events:none;
  background:
    radial-gradient(38% 26% at 26% 30%, rgba(130,180,255,.30), transparent 62%),
    radial-gradient(34% 24% at 74% 68%, rgba(255,140,220,.24), transparent 62%);
  filter:blur(18px);
  animation:caustic 16s ease-in-out infinite alternate}
@keyframes caustic{
  from{transform:translate3d(-3%, -2%, 0) rotate(-2deg) scale(1)}
  to{transform:translate3d(4%, 3%, 0) rotate(3deg) scale(1.08)}
}

.tile:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.55);
  backdrop-filter:blur(30px) saturate(210%) brightness(1.12);
  -webkit-backdrop-filter:blur(30px) saturate(210%) brightness(1.12);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.20),
    inset 0 -34px 56px -30px rgba(0,0,0,.60),
    0 34px 80px rgba(0,0,0,.50)}
.tile.t1:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 34px 80px rgba(61,110,240,.45)}
.tile.t2:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.75), 0 34px 80px rgba(192,52,138,.45)}

.tile-inner{padding:36px 40px 40px;position:relative;z-index:3}
.tile .ico{font-size:46px;line-height:1;margin-bottom:18px;display:block;transition:transform .5s;filter:drop-shadow(0 8px 22px rgba(0,0,0,.55))}
.tile:hover .ico{transform:scale(1.14) rotate(-5deg)}
.tile h2{margin:0 0 8px;font-size:31px;font-weight:750;letter-spacing:.6px;text-shadow:0 2px 18px rgba(0,0,0,.60)}
.tile p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.tile .arrow{margin-top:24px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650;
  color:rgba(255,255,255,.95);transition:gap .35s}
.tile:hover .arrow{gap:18px}
.badge{position:absolute;top:24px;right:26px;z-index:3;font-size:12px;padding:5px 13px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.34);
  backdrop-filter:blur(10px);letter-spacing:.3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.40)}

.wipe{position:fixed;inset:0;z-index:99;background:#05060c;opacity:0;pointer-events:none;transition:opacity .22s ease}
.wipe.on{opacity:1}

@media (max-width:820px){
  .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px}
  .tile-inner{padding:24px 26px 28px}
  .tile .ico{font-size:34px;margin-bottom:12px}
  .tile h2{font-size:23px}
  .badge{top:18px;right:20px}
}
@media (prefers-reduced-motion:reduce){
  .tile,.tile .ico,.tile .arrow{transition:none}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="tiles">
  <a class="tile t1" href="album.html">
    <span class="caustics"></span>
    <span class="sheen"></span>
    <span class="badge">相册</span>
    <div class="tile-inner">
      <span class="ico">🖼️</span>
      <h2>相册</h2>
      <p>保存的照片与证书，点开看大图</p>
      <span class="arrow">进入 <span>→</span></span>
    </div>
  </a>
  <a class="tile t2" href="links.html">
    <span class="caustics"></span>
    <span class="sheen"></span>
    <span class="badge">珍藏资源</span>
    <div class="tile-inner">
      <span class="ico">📚</span>
      <h2>珍藏资源</h2>
      <p>收藏的链接，可自己添加整理</p>
      <span class="arrow">进入 <span>→</span></span>
    </div>
  </a>
</div>

<div class="wipe" id="wipe"></div>

<script>
(() => {
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d', { alpha: false });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1;
  let particles = [];
  let blobs = [];
  const mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const count = Math.round(Math.min(150, Math.max(50, (W * H) / 14000)));
    particles = Array.from({ length: count }, () => {
      const depth = Math.random() * 0.8 + 0.2;         // 0.2 = far, 1 = near
      return {
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.22 * depth,
        vy: (Math.random() - 0.5) * 0.22 * depth,
        r: 0.7 + depth * 1.9,
        depth,
        hue: Math.random() < 0.5 ? 215 : 320,
        tw: Math.random() * Math.PI * 2,
      };
    });

    blobs = [
      { x: 0.18, y: 0.24, r: 0.42, hue: 218, sp: 0.00013, ph: 0 },
      { x: 0.82, y: 0.76, r: 0.46, hue: 322, sp: 0.00011, ph: 1.7 },
      { x: 0.55, y: 0.10, r: 0.32, hue: 265, sp: 0.00017, ph: 3.1 },
    ];
  }

  const LINK_DIST = 132;

  function draw(t) {
    // --- background wash ---
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#05060c');
    g.addColorStop(0.55, '#080a14');
    g.addColorStop(1, '#0a0710');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // --- aurora blobs ---
    ctx.globalCompositeOperation = 'lighter';
    for (const b of blobs) {
      const cx = (b.x + Math.sin(t * b.sp + b.ph) * 0.10) * W;
      const cy = (b.y + Math.cos(t * b.sp * 1.3 + b.ph) * 0.10) * H;
      const rr = b.r * Math.min(W, H);
      const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
      rg.addColorStop(0, 'hsla(' + b.hue + ',85%,58%,0.20)');
      rg.addColorStop(0.45, 'hsla(' + b.hue + ',85%,50%,0.08)');
      rg.addColorStop(1, 'hsla(' + b.hue + ',85%,50%,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // --- parallax offset ---
    const px = (mouse.x - 0.5) * 26;
    const py = (mouse.y - 0.5) * 26;

    // --- links ---
    ctx.lineWidth = 1;
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 > LINK_DIST * LINK_DIST) continue;
        const near = a.depth > 0.62 && b.depth > 0.62;
        if (!near && d2 > (LINK_DIST * 0.68) ** 2) continue;   // far ones only link very close
        const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * (near ? 0.20 : 0.07);
        ctx.strokeStyle = 'rgba(150,190,255,' + alpha.toFixed(3) + ')';
        ctx.beginPath();
        ctx.moveTo(a.x + px * a.depth, a.y + py * a.depth);
        ctx.lineTo(b.x + px * b.depth, b.y + py * b.depth);
        ctx.stroke();
      }
    }

    // --- particles ---
    for (const p of particles) {
      if (!reduce) {
        p.x += p.vx; p.y += p.vy; p.tw += 0.015;
        if (p.x < -20) p.x = W + 20; if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20; if (p.y > H + 20) p.y = -20;
      }
      const tw = 0.65 + Math.sin(p.tw) * 0.35;
      const x = p.x + px * p.depth;
      const y = p.y + py * p.depth;
      const r = p.r * (1 + (p.depth - 0.5) * 0.5);
      const rg = ctx.createRadialGradient(x, y, 0, x, y, r * 4.2);
      rg.addColorStop(0, 'hsla(' + p.hue + ',100%,82%,' + (0.85 * tw * p.depth).toFixed(3) + ')');
      rg.addColorStop(0.35, 'hsla(' + p.hue + ',100%,66%,' + (0.30 * tw * p.depth).toFixed(3) + ')');
      rg.addColorStop(1, 'hsla(' + p.hue + ',100%,60%,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(x, y, r * 4.2, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,' + (0.80 * tw * p.depth).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, r * 0.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  let raf = 0, last = 0, running = true;
  function loop(t) {
    if (!running) return;
    // smooth the parallax
    mouse.x += (mouse.tx - mouse.x) * 0.06;
    mouse.y += (mouse.ty - mouse.y) * 0.06;
    if (t - last > 1000 / 45) { draw(t); last = t; }
    raf = requestAnimationFrame(loop);
  }

  addEventListener('resize', () => { resize(); draw(performance.now()); });
  addEventListener('mousemove', (e) => {
    mouse.tx = e.clientX / innerWidth;
    mouse.ty = e.clientY / innerHeight;
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; cancelAnimationFrame(raf); }
    else if (!running) { running = true; last = 0; raf = requestAnimationFrame(loop); }
  });

  resize();
  raf = requestAnimationFrame(loop);

  // tile sheen follows the cursor
  document.querySelectorAll('.tile').forEach((tile) => {
    tile.addEventListener('mousemove', (e) => {
      const r = tile.getBoundingClientRect();
      tile.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
      tile.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
    });
    tile.addEventListener('click', (e) => {
      const href = tile.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      document.getElementById('wipe').classList.add('on');
      setTimeout(() => { location.href = href; }, 180);
    });
  });
})();
</script>
</body>
</html>
