<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>收藏夹</title>
<style>
:root{--bg:#f2f2f4;--panel:#fff;--line:#e2e2e6;--text:#1d1d1f;--dim:#86868b;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--panel:#17171a;--line:#2a2a30;--text:#f2f2f4;--dim:#8f8f96;--accent:#4aa3ff;--accent-soft:rgba(74,163,255,.14)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.top h1{margin:0;font-size:16px;font-weight:650}
.top .sub{color:var(--dim);font-size:12.5px}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
.toolbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--accent-soft)}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  font-size:12.5px;cursor:pointer;font-weight:600;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.fav{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;transition:.15s}
.fav:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.10)}
.fav a{display:block;color:inherit;text-decoration:none}
.fav .t{font-weight:600;font-size:15px;margin-bottom:4px;padding-right:52px;word-break:break-word}
.fav .u{color:var(--accent);font-size:12px;word-break:break-all}
.fav .c{display:inline-block;margin-top:10px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.fav .ops{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:.15s}
.fav:hover .ops,.fav:focus-within .ops{opacity:1}
.fav .ops button{width:26px;height:26px;border:0;border-radius:7px;background:var(--accent-soft);color:var(--text);cursor:pointer;font-size:13px;line-height:1}
.fav .ops button:hover{background:var(--accent);color:#fff}
.empty{color:var(--dim);font-size:13.5px;padding:36px 0;text-align:center;border:1px dashed var(--line);border-radius:14px}

</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← 返回</a><h1>收藏夹</h1><span class="sub">常去的网站</span></div>
<div class="wrap">
<div class="toolbar">
  <input id="search" placeholder="搜索名称、网址或分类…">
  <button class="btn" id="addBtn">+ 添加</button>
  <button class="btn ghost" id="exportBtn">导出</button>
  <button class="btn ghost" id="importBtn">导入</button>
  <input type="file" id="importFile" accept=".json" hidden>
</div>
<div class="chips groups" id="chips"></div>
<div class="cards" id="cards"></div>
<div class="empty" id="empty" hidden>还没有收藏，点「+ 添加」加一个</div>
</div>
<script>
const DEFAULT_FAVS = [
  { name: 'B 站', url: 'https://www.bilibili.com', cat: '视频' },
  { name: 'GitHub', url: 'https://github.com', cat: '开发' },
  { name: 'DeepSeek', url: 'https://www.deepseek.com', cat: 'AI' },
];
const LS_KEY = 'favBookmarks';
let favs = [];
let activeCat = '全部';
let keyword = '';

function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { favs = JSON.parse(raw); return; } } catch (e) {}
  favs = DEFAULT_FAVS.slice(); save();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(favs)); } catch (e) { alert('保存失败：浏览器存储不可用'); } }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function host(u) { try { return new URL(u).host; } catch { return u; } }

const cardsEl = document.getElementById('cards'), emptyEl = document.getElementById('empty'), chipsEl = document.getElementById('chips');

function renderChips() {
  const cats = ['全部', ...new Set(favs.map((f) => f.cat).filter(Boolean))];
  if (!cats.includes(activeCat)) activeCat = '全部';
  chipsEl.innerHTML = cats.map((c) => '<button class="chip' + (c === activeCat ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join('');
}
function render() {
  renderChips();
  const kw = keyword.trim().toLowerCase();
  const list = favs.filter((f) =>
    (activeCat === '全部' || f.cat === activeCat) &&
    (!kw || (f.name + ' ' + f.url + ' ' + (f.cat || '')).toLowerCase().includes(kw)));
  cardsEl.innerHTML = list.map((f) => {
    const i = favs.indexOf(f);
    return '<article class="fav" data-i="' + i + '">' +
      '<div class="ops"><button data-op="edit" title="编辑">✎</button><button data-op="del" title="删除">🗑</button></div>' +
      '<a href="' + esc(f.url) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="t">' + esc(f.name) + '</div><div class="u">' + esc(host(f.url)) + '</div>' +
        (f.cat ? '<span class="c">' + esc(f.cat) + '</span>' : '') + '</a></article>';
  }).join('');
  emptyEl.hidden = list.length > 0;
}

chipsEl.addEventListener('click', (e) => {
  const b = e.target.closest('.chip');
  if (!b) return;
  activeCat = b.dataset.cat;
  render();
});
cardsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-op]');
  if (!btn) return;
  e.preventDefault();
  const i = Number(btn.closest('.fav').dataset.i);
  if (btn.dataset.op === 'del') {
    if (confirm('删除「' + favs[i].name + '」？')) { favs.splice(i, 1); save(); render(); }
  } else edit(i);
});
function edit(i) {
  const cur = favs[i] || { name: '', url: '', cat: '' };
  const name = prompt('名称', cur.name); if (name === null) return;
  const url = prompt('网址（http:// 或 https:// 开头）', cur.url); if (url === null) return;
  if (!/^https?:\/\//i.test(url.trim())) { alert('网址要以 http:// 或 https:// 开头'); return; }
  const cat = prompt('分类（可留空，比如「视频」「工具」）', cur.cat || ''); if (cat === null) return;
  const item = { name: name.trim() || host(url.trim()), url: url.trim(), cat: cat.trim() };
  if (i >= 0) favs[i] = item; else favs.push(item);
  save(); render();
}
document.getElementById('addBtn').onclick = () => edit(-1);
document.getElementById('search').addEventListener('input', (e) => { keyword = e.target.value; render(); });
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(favs, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'favorites.json'; a.click(); URL.revokeObjectURL(a.href);
};
const fileEl = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => fileEl.click();
fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('格式不对');
    favs = data.filter((x) => x && x.url).map((x) => ({ name: String(x.name || host(String(x.url))), url: String(x.url), cat: String(x.cat || '') }));
    save(); render();
  } catch (err) { alert('导入失败：' + err.message); }
  fileEl.value = '';
});
load(); render();
</script>
</body>
</html>
