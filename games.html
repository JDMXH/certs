<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏</title>
<style>
:root{--bg:#f2f2f4;--panel:#fff;--line:#e2e2e6;--text:#1d1d1f;--dim:#86868b;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--panel:#17171a;--line:#2a2a30;--text:#f2f2f4;--dim:#8f8f96;--accent:#4aa3ff;--accent-soft:rgba(74,163,255,.14)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.top h1{margin:0;font-size:16px;font-weight:650}
.top .sub{color:var(--dim);font-size:12.5px}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit}
.toolbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--accent-soft)}
.empty{color:var(--dim);font-size:13.5px;padding:36px 0;text-align:center;border:1px dashed var(--line);border-radius:14px}
.game .ops{position:absolute;top:10px;right:10px;display:flex;gap:4px;opacity:0;transition:.15s;z-index:2}
.game:hover .ops,.game:focus-within .ops{opacity:1}
.game .ops button{width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.9);color:#111;cursor:pointer;font-size:13px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.game .ops button:hover{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){ .game .ops button{background:rgba(30,30,36,.92);color:#f2f2f4} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.game:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.10)}
.game > a{display:block;color:inherit;text-decoration:none}
.thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(140deg,rgba(10,132,255,.12),rgba(160,120,255,.10))}
.body{padding:14px 16px 16px}
.body h3{margin:0 0 4px;font-size:15.5px;font-weight:650}
.body p{margin:0;color:var(--dim);font-size:13px}
.tag{display:inline-block;margin-top:10px;font-size:11.5px;padding:3px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.note{margin-top:26px;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--dim);font-size:13px}

</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← 返回</a><h1>游戏</h1><span class="sub">点开直接玩</span></div>
<div class="wrap">
<div class="toolbar">
  <input id="search" placeholder="搜索游戏名、分类…">
  <input id="linkInput" placeholder="粘贴游戏链接，回车直接添加…">
  <button class="btn" id="addLinkBtn">导入链接</button>
  <button class="btn" id="addBtn">+ 添加</button>
  <button class="btn ghost" id="exportBtn">导出</button>
  <button class="btn ghost" id="importBtn">导入</button>
  <input type="file" id="importFile" accept=".json" hidden>
</div>
<div class="grid" id="games"></div>
<div class="empty" id="empty" hidden>列表是空的，点「+ 添加」加一个</div>
<div class="note">「导入链接」：粘贴网址后回车，用域名自动当游戏名，想改再点卡片上的 ✎。导出的 JSON 可以用「导入」换回来。数据保存在这台浏览器里。</div>
</div>
<script>
// Game list. { name, desc, tag, icon, href }
const DEFAULT_GAMES = [
  { name: '2048', desc: '滑动合并数字，合到 2048 为止', tag: '益智', icon: '🔢', href: 'https://play2048.co/' },
  { name: '贪吃蛇', desc: '经典贪吃蛇，方向键控制', tag: '街机', icon: '🐍', href: 'https://playsnake.org/' },
  { name: '俄罗斯方块', desc: '消除整行，越快分越高', tag: '街机', icon: '🧱', href: 'https://tetris.com/play-tetris' },
  { name: '扫雷', desc: '根据数字推理雷的位置', tag: '益智', icon: '💣', href: 'https://minesweeper.online/' },
];
const LS_KEY = 'gamesList';
let games = [];
let keyword = '';

function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { games = JSON.parse(raw); return; } } catch (e) {}
  games = DEFAULT_GAMES.slice(); save();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(games)); } catch (e) { alert('保存失败：浏览器存储不可用'); } }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function host(u) { try { return new URL(u).host; } catch { return String(u); } }

const gridEl = document.getElementById('games');
const emptyEl = document.getElementById('empty');

function render() {
  const kw = keyword.trim().toLowerCase();
  const list = games.filter((g) => !kw || ((g.name || '') + ' ' + (g.desc || '') + ' ' + (g.tag || '') + ' ' + g.href).toLowerCase().includes(kw));
  gridEl.innerHTML = list.map((g) => {
    const i = games.indexOf(g);
    return '<article class="game" data-i="' + i + '">' +
      '<div class="ops"><button data-op="edit" title="编辑">✎</button><button data-op="del" title="删除">🗑</button></div>' +
      '<a href="' + esc(g.href) + '" target="_blank" rel="noopener noreferrer">' +
        '<div class="thumb">' + (g.icon || '🎮') + '</div>' +
        '<div class="body"><h3>' + esc(g.name) + '</h3><p>' + esc(g.desc || '') + '</p>' +
        (g.tag ? '<span class="tag">' + esc(g.tag) + '</span>' : '') + '</div>' +
      '</a></article>';
  }).join('');
  emptyEl.hidden = list.length > 0;
}

gridEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-op]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const i = Number(btn.closest('.game').dataset.i);
  if (btn.dataset.op === 'del') {
    if (confirm('删除「' + games[i].name + '」？')) { games.splice(i, 1); save(); render(); }
  } else edit(i);
});

function edit(i) {
  const cur = games[i] || { name: '', desc: '', tag: '', icon: '🎮', href: '' };
  const name = prompt('游戏名称', cur.name); if (name === null) return;
  const href = prompt('游戏链接（http:// 或 https:// 开头）', cur.href); if (href === null) return;
  if (!/^https?:\/\//i.test(href.trim())) { alert('链接要以 http:// 或 https:// 开头'); return; }
  const desc = prompt('一句描述（可留空）', cur.desc || ''); if (desc === null) return;
  const tag = prompt('分类（可留空，比如「益智」「街机」）', cur.tag || ''); if (tag === null) return;
  const icon = prompt('图标（一个 emoji，可留空）', cur.icon || '🎮'); if (icon === null) return;
  const item = { name: name.trim() || host(href.trim()), desc: desc.trim(), tag: tag.trim(), icon: (icon.trim() || '🎮').slice(0, 4), href: href.trim() };
  if (i >= 0) games[i] = item; else games.push(item);
  save(); render();
}

document.getElementById('addBtn').onclick = () => edit(-1);

// 导入链接：粘贴一个网址，直接用域名当名字加进列表。
// 单独做这个入口，是因为「+ 添加」要连答 5 个问题，只想贴个链接时太啰嗦。
const linkInput = document.getElementById('linkInput');
function importLink() {
  const raw = (linkInput.value || '').trim();
  if (!raw) { linkInput.focus(); return; }
  // the literal regex source lives inside a JS template string in THIS builder, so
  // a bare / would be eaten by the template literal - use RegExp() to stay safe.
  const url = /^https?:/i.test(raw) ? raw : 'https://' + raw;
  let parsed;
  try { parsed = new URL(url); } catch (e) { alert('这个链接看不懂：' + raw); return; }
  if (!parsed.hostname.includes('.')) { alert('地址看起来不完整：' + raw); return; }
  if (games.some((g) => g.href === url)) { alert('已经加过了：' + url); linkInput.value = ''; return; }
  games.push({
    name: parsed.hostname.replace(/^www./, ''),
    desc: '',
    tag: '',
    icon: '🎮',
    href: url,
  });
  save();
  render();
  linkInput.value = '';
  linkInput.blur();
  const last = document.querySelector('.game[data-i="' + (games.length - 1) + '"]');
  if (last) { last.scrollIntoView({ behavior: 'smooth', block: 'center' }); last.style.outline = '2px solid var(--accent)'; setTimeout(() => { last.style.outline = ''; }, 1200); }
}
document.getElementById('addLinkBtn').onclick = importLink;
linkInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); importLink(); } });
document.getElementById('search').addEventListener('input', (e) => { keyword = e.target.value; render(); });

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(games, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'games.json';
  a.click();
  URL.revokeObjectURL(a.href);
};
const fileEl = document.getElementById('importFile');
document.getElementById('importBtn').onclick = () => fileEl.click();
fileEl.addEventListener('change', async () => {
  const f = fileEl.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw new Error('格式不对：需要一个数组');
    const clean = data.filter((x) => x && x.href).map((x) => ({
      name: String(x.name || host(String(x.href))),
      desc: String(x.desc || ''),
      tag: String(x.tag || ''),
      icon: String(x.icon || '🎮').slice(0, 4),
      href: String(x.href),
    }));
    if (!clean.length) throw new Error('没有可用的条目');
    if (!confirm('导入 ' + clean.length + ' 个游戏，会替换当前列表，继续？')) { fileEl.value = ''; return; }
    games = clean; save(); render();
  } catch (err) { alert('导入失败：' + err.message); }
  fileEl.value = '';
});

load(); render();
</script>
</body>
</html>
