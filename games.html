<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏</title>
<style>
:root{--bg:#f2f2f4;--panel:#fff;--line:#e2e2e6;--text:#1d1d1f;--dim:#86868b;--accent:#0a84ff;--accent-soft:rgba(10,132,255,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0f;--panel:#17171a;--line:#2a2a30;--text:#f2f2f4;--dim:#8f8f96;--accent:#4aa3ff;--accent-soft:rgba(74,163,255,.14)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,border-color .15s}
.back:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.top h1{margin:0;font-size:16px;font-weight:650}
.top .sub{color:var(--dim);font-size:12.5px}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{position:relative;display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.game:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.10)}
.thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:46px;
  background:linear-gradient(140deg,rgba(10,132,255,.12),rgba(160,120,255,.10))}
.body{padding:14px 16px 16px}
.body h3{margin:0 0 4px;font-size:15.5px;font-weight:650}
.body p{margin:0;color:var(--dim);font-size:13px}
.tag{display:inline-block;margin-top:10px;font-size:11.5px;padding:3px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-weight:600}
.note{margin-top:26px;padding:14px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--dim);font-size:13px}

</style>
</head>
<body>
<div class="top"><a class="back" href="index.html">← 返回</a><h1>游戏</h1><span class="sub">点开直接玩</span></div>
<div class="wrap">
<div class="grid" id="games"></div>
<div class="note">想加更多小游戏，把名称和链接发我，我加进列表。也可以直接编辑本文件里的 GAMES 数组。</div>
</div>
<script>
// Game list. Add entries here: { name, desc, tag, icon, href }
const GAMES = [
  { name: '2048', desc: '滑动合并数字，合到 2048 为止', tag: '益智', icon: '🔢', href: 'https://play2048.co/' },
  { name: '贪吃蛇', desc: '经典贪吃蛇，方向键控制', tag: '街机', icon: '🐍', href: 'https://playsnake.org/' },
  { name: '俄罗斯方块', desc: '消除整行，越快分越高', tag: '街机', icon: '🧱', href: 'https://tetris.com/play-tetris' },
  { name: '扫雷', desc: '根据数字推理雷的位置', tag: '益智', icon: '💣', href: 'https://minesweeper.online/' },
];
document.getElementById('games').innerHTML = GAMES.map((g) =>
  '<a class="game" href="' + g.href + '" target="_blank" rel="noopener noreferrer">' +
    '<div class="thumb">' + g.icon + '</div>' +
    '<div class="body"><h3>' + g.name + '</h3><p>' + g.desc + '</p><span class="tag">' + g.tag + '</span></div>' +
  '</a>').join('');
</script>
</body>
</html>
